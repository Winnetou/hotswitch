version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/tests"
    schedule:
      interval: "weekly"
    groups:
      test-dependencies:
        patterns:
          - "*"
